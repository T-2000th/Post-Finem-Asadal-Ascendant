 #####Mangal religion
 mangal:0 "Mangal"
 mangal_religion_desc:0 "Mangal isn't a unified faith. Rather, it is a catch-all term that has evolved over millenia to refer to the various folk and tribal faiths of Vanga and the east, all having been influenced by Hinduism to some degree. From Chumdeo, the royal deity of the Ahoms to Dakshin Rai, the great Tiger King of the Sundarbans and even Chandi, the supreme deity often equated to Hindu Durga; all are referred to as Mangal."
