 #####Nanaism religion
 nanaism:0 "Nanaism"
 nanaism_religion_desc:0 "Neither Mazdean nor Hindu nor Sinitic, the faith of Sogdia has been influenced by all three surrounding civilizations owing to it's position on the Silk Road. From Nana, the most revered goddess of the Sogdians and a clear import from Mesopotamia, to Adbad, the Sogdian Ohrmuzd who is garbed as Vedic Indra-the faith of Sogdia stands as a testament to the rich history of religious syncretism in the old Indo-Iranian world and the Silk Road."
