##Mohism religion
 mohism:0 "Mojia"
 mohism_religion_desc:0 "Mohism or Mojia is rationalist and ethical faith centered on universal love and impartiality. Mohists believe in aligning human behavior with the will of Heaven (Tian) through simplicity, justice, and the pursuit of collective welfare, rejecting extravagance and favoritism in favor of moral order and practical benefit."
