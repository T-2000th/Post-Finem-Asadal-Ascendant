#####Mahasamghika religion
 mahasamghika:0 "Mahasamghika"
 mahasamghika_religion_desc:0 "The school of the Great Sangha (Mahasamghika) is the oldest yet the most restricted of the Buddhist nikayas. Restricted mainly to the old Buddhist stronghold of Vajjika and to the west in Gujarat, this nikaya is known mainly for advocating the supramundane nature of buddhas and bodhisattvas as well as a rejection of most forms of syncretism. They have mainly spread via trade and colonialism in the east."
 mahasamghika_rebels_title:0 "Religious"
