 #####Daoism religion
 daoism:0 "Daojia"
 daoism_religion_desc:0 "A philosophical and spiritual faith centered on harmony with the Dao, the fundamental way of the universe. It emphasizes balance, natural order, and non-interference (wu wei), teaching that enlightenment comes through simplicity, humility, and attunement to the flow of existence."
