 #####Bodhisattvayana/Mahayana religion(pls replace all mahayana with this)
 bodhisattvayana:0 "Bodhisattvayana"
 bodhisattvayana_religion_desc:0 "The Bodhisattvayana nikaya has unclear origins. Descended from a mixture of various Mahasamghika and Sthavira sanghas, it embraces the core doctrine of the Mahasamghikas along with several other sutras and a healthy dose of syncretism. Monks have spread this nikaya along the trade routes all the way to the lands of the Yavana and Rum in the distant west."
