 #####Lingayatism religion
 lingayatism:0 "Lingayatism"
 lingayatism_religion_desc:0 "Considered by many to be nastika, the Lingayats, or Veerashaivas as they call themselves, are a reformation of Hinduism. Rejecting the authority of the Vedas, Puranas and all scriptures, they emphasize a strong personal devotion to Shiva in the form of Ishtalinga, the One True reality. They reject all distinctions of caste and gender, and the legacy of their oppression before they came to power has endowed them with a strong desire to spread faith and freedom to all Jambudvipa."
