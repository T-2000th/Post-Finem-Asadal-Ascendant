 #####Sarnaism religion
 sarnaism:0 "Sarnaism"
 sarnaism_religion_desc:0 "Sarna Dharma, the way of the sacred groves, is the form of nature-worship embraced by the Adivasis of Central Jambudvipa. Adherents revere the Sarnas(sacred groves) found in every village where the gram deoti resides. Great emphasis is placed on the jal(water), jangal(forest) and jamin(land) and on living harmoniously with nature."
