 #####Kaumaram religion
 kaumaram:0 "Kaumaram"
 kaumaram_religion_desc:0 "A localised, warlike interpretation of Hinduism based on the Shaiva agamas and the Kanda Puranam, Kaumaram is a sect that places Murugan(known to others as Skanda) and his family as the primary objects of veneration. This tradition has wholeheartedly embraced royal deification to a severe degree. The most important ritual sites for Kaumaram are the Arupadai Veedu, the Six Abodes of Murugan."
