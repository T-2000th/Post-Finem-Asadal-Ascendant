 #####Tamraparniya/Theravada religion(pls replace all theravada with this)
 tamraparniya:0 "Tamraparniya"
 tamraparniya_religion_desc:0 "The Tamraparniya nikaya is the last direct descendant of the Sthaviras, who broke away from the Mahasamghika over changes to the vinaya. This nikaya rejects the concept of Bodhisattvas and emphasizes a powerful, austere clergy based around various sanghas and headed by the powerful Sangha of Anuradhapura."
