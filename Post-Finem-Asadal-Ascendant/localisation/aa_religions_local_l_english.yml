#####Mazuism religion
 mazuism:0 "Mazuism"
 mazuism_religion_desc:0 "A mystical and philosophical faith rooted in the worship of Mazu, the water goddess, who is seen as The One — the ultimate, indivisible source of all creation. Mazuism teaches that all gods, spirits, and forces of the world are emanations of Mazu’s divine essence, imperfect reflections of her unity and perfection. Through devotion, contemplation, and harmony with the flow of existence, believers seek to transcend the material world and approach closer to Mazu’s pure, eternal presence."
